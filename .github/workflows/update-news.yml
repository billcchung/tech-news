name: Update news and deploy

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:        # manual run button
  push:
    branches: [main]        # deploy on code changes too

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run browser tests
        run: node --test tests_js/*.test.mjs

      - name: Fetch news
        run: python scripts/fetch_news.py site/news.json

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/news.json site/archive
          git diff --cached --quiet || git commit -m "chore: update news $(date -u +%F)"
          # -X theirs keeps OUR freshly generated news.json if the remote moved
          # (during rebase, "theirs" = the commit being replayed, i.e. ours)
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
