<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech News — Cloud, DevOps, SRE, AI</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --cloud: #58a6ff; --devops: #3fb950; --ai: #d2a8ff; --tech: #f0883e;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #0969da;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 1.5rem 1rem 4rem;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 1.25rem; }
  h1 { font-size: 1.5rem; }
  #updated { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
  #filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 1.25rem; }
  #filters button {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: .3rem .9rem; font-size: .85rem; cursor: pointer;
  }
  #filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #search {
    width: 100%; padding: .5rem .75rem; margin-bottom: 1rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: .95rem;
  }
  .item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: .9rem 1rem; margin-bottom: .7rem;
  }
  .item a.title { color: var(--text); font-weight: 600; text-decoration: none; }
  .item a.title:hover { color: var(--accent); }
  .meta { font-size: .8rem; color: var(--muted); margin-top: .3rem; display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .badge { border-radius: 999px; padding: .05rem .6rem; font-size: .75rem; color: #fff; }
  .badge.Cloud { background: var(--cloud); }
  .badge.DevOpsSRE { background: var(--devops); }
  .badge.AI { background: var(--ai); color: #1f2328; }
  .badge.Tech { background: var(--tech); }
  .summary { font-size: .88rem; color: var(--muted); margin-top: .45rem; }
  #empty { color: var(--muted); text-align: center; padding: 2rem; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tech News</h1>
    <div id="updated">Loading…</div>
  </header>
  <input id="search" type="search" placeholder="Search titles and summaries…">
  <div id="filters"></div>
  <main id="list"></main>
  <div id="empty">No matching items.</div>
</div>
<script>
(async () => {
  const res = await fetch('news.json?t=' + Date.now());
  const data = await res.json();
  const updated = new Date(data.updated);
  document.getElementById('updated').textContent =
    'Last updated ' + updated.toLocaleString() +
    (data.failed_sources?.length ? ' · unavailable: ' + data.failed_sources.join(', ') : '');

  const cats = ['All', ...new Set(data.items.map(i => i.category))];
  let activeCat = 'All', query = '';
  const filters = document.getElementById('filters');
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.className = c === 'All' ? 'active' : '';
    b.onclick = () => {
      activeCat = c;
      filters.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      render();
    };
    filters.appendChild(b);
  });
  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.toLowerCase(); render();
  });

  const esc = s => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
  const rel = iso => {
    if (!iso) return '';
    const mins = (Date.now() - new Date(iso)) / 60000;
    if (mins < 60) return Math.max(1, Math.round(mins)) + 'm ago';
    if (mins < 1440) return Math.round(mins / 60) + 'h ago';
    return Math.round(mins / 1440) + 'd ago';
  };

  function render() {
    const list = document.getElementById('list');
    const items = data.items.filter(i =>
      (activeCat === 'All' || i.category === activeCat) &&
      (!query || (i.title + ' ' + i.summary).toLowerCase().includes(query))
    );
    document.getElementById('empty').style.display = items.length ? 'none' : 'block';
    list.innerHTML = items.map(i => `
      <article class="item">
        <a class="title" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>
        <div class="meta">
          <span class="badge ${i.category.replace(/[^A-Za-z]/g, '')}">${esc(i.category)}</span>
          <span>${esc(i.source)}</span>
          <span>${rel(i.published)}</span>
        </div>
        ${i.summary ? `<div class="summary">${esc(i.summary)}</div>` : ''}
      </article>`).join('');
  }
  render();
})().catch(() => {
  document.getElementById('updated').textContent = 'Failed to load news.json';
});
</script>
</body>
</html>
