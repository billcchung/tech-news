<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Curated technology news with category, tag, and historical archive filters.">
<title>Tech News Archive</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080c12;
    --panel: #101722;
    --panel-hover: #151f2d;
    --border: #253246;
    --text: #eef4fb;
    --muted: #9aabc0;
    --accent: #53b3ff;
    --accent-strong: #168be3;
    --tag: #1a2a3d;
    --shadow: 0 16px 44px rgb(0 0 0 / 24%);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f3f6f9;
      --panel: #ffffff;
      --panel-hover: #f8fafc;
      --border: #d8e0ea;
      --text: #16202d;
      --muted: #5d6b7c;
      --accent: #086fc1;
      --accent-strong: #055b9f;
      --tag: #eaf3fb;
      --shadow: 0 16px 44px rgb(31 45 61 / 9%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 10% -10%, rgb(49 139 211 / 18%), transparent 30rem),
      var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button, input, select { font: inherit; }
  button, select { cursor: pointer; }
  .wrap { width: min(1040px, calc(100% - 2rem)); margin: 0 auto; padding: 2.5rem 0 5rem; }
  .masthead {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1.5rem;
    align-items: end;
    padding-bottom: 1.6rem;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    color: var(--accent);
    font-size: .78rem;
    font-weight: 750;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  h1 { margin: .3rem 0 .25rem; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1; letter-spacing: -.045em; }
  .dek { margin: 0; color: var(--muted); max-width: 42rem; }
  .archive-control { display: grid; gap: .35rem; min-width: 15rem; }
  .archive-control label { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  select, #search {
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .7rem;
    padding: .7rem .85rem;
  }
  #status { min-height: 1.4rem; margin: 1rem 0; color: var(--muted); font-size: .86rem; }
  .toolbar { display: grid; gap: .85rem; margin-bottom: 1.5rem; }
  #search { width: 100%; }
  .filters { display: flex; flex-wrap: wrap; gap: .45rem; }
  .filter, .tag-filter, .article-tag {
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .35rem .7rem;
    font-size: .78rem;
  }
  .filter:hover, .tag-filter:hover, .article-tag:hover { color: var(--text); border-color: var(--accent); }
  .filter.active, .tag-filter.active { color: #fff; background: var(--accent-strong); border-color: var(--accent-strong); }
  .tag-row { padding-top: .75rem; border-top: 1px solid var(--border); }
  .day-group { margin-top: 1.8rem; }
  .day-heading {
    margin: 0 0 .75rem;
    color: var(--muted);
    font-size: .8rem;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  .item {
    background: linear-gradient(145deg, var(--panel), color-mix(in srgb, var(--panel) 92%, var(--accent) 8%));
    border: 1px solid var(--border);
    border-radius: 1rem;
    box-shadow: var(--shadow);
    padding: 1rem 1.1rem;
    margin-bottom: .75rem;
    transition: border-color .15s ease, transform .15s ease;
  }
  .item:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); transform: translateY(-1px); }
  .title { color: var(--text); font-size: 1.05rem; font-weight: 720; line-height: 1.35; text-decoration: none; }
  .title:hover { color: var(--accent); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; margin-top: .55rem; color: var(--muted); font-size: .78rem; }
  .badge { color: #fff; border-radius: 999px; padding: .14rem .55rem; background: #455468; }
  .category-ai-ml { background: #7557b8; }
  .category-cloud-infrastructure { background: #176da7; }
  .category-devops-reliability { background: #267a4a; }
  .category-software-engineering { background: #5362b6; }
  .category-security-privacy { background: #a44747; }
  .category-hardware-emerging-tech { background: #9a6627; }
  .category-general-tech { background: #6a5878; }
  .article-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .7rem; }
  .article-tag { background: var(--tag); padding: .2rem .55rem; }
  .excerpt { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); }
  .excerpt-label { color: var(--accent); font-size: .68rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .excerpt p { margin: .25rem 0 0; color: var(--muted); font-size: .88rem; }
  #empty { color: var(--muted); text-align: center; padding: 3rem 1rem; }
  @media (max-width: 700px) {
    .wrap { padding-top: 1.5rem; }
    .masthead { grid-template-columns: 1fr; align-items: start; }
    .archive-control { min-width: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="eyebrow">Curated signal</div>
      <h1>Tech News</h1>
      <p class="dek">Direct reporting and engineering writing, organized by topic and preserved month by month.</p>
    </div>
    <div class="archive-control">
      <label for="archive">Edition</label>
      <select id="archive">
        <option value="Current">Current</option>
      </select>
    </div>
  </header>
  <div id="status" aria-live="polite">Loading current news…</div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search titles, excerpts, sources, and tags…" aria-label="Search articles">
    <nav id="categories" class="filters" aria-label="Categories"></nav>
    <nav id="tags" class="filters tag-row" aria-label="Tags"></nav>
  </div>
  <main id="list"></main>
  <div id="empty" hidden>No matching articles.</div>
</div>
<script type="module" src="app.mjs"></script>
</body>
</html>
